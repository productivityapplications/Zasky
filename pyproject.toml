[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "zasky"
version = "0.1.0"
description = "Single-owner chat-native planning agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Zasky operator" }]
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.8",
  "uvicorn==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
]

[project.scripts]
zasky = "zasky.__main__:main"
zasky-maintenance = "zasky.ops.maintenance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zasky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: requires a real Switch server and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations"]
